; php-fpm pool overrides. Loaded after www.conf because "zz-" sorts last.
[www]
; Only ever execute .php. FPM's own default also allows .phar, and nothing
; here ships a phar meant to be served. nginx already refuses requests that
; do not name a real file (try_files $uri =404 in the PHP location), so this
; is the second layer rather than the only one.
security.limit_extensions = .php
