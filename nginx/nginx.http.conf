# HTTP-only configuration (default).
#
# Browsers block self-signed-cert pages on first access, so this mode
# serves plain HTTP on port 80 with no redirect to HTTPS, letting the
# install wizard render immediately. Set HTTPS=true in .env (and
# re-run ./setup.sh) to switch to nginx.https.conf for local TLS.
server {
    listen 80;
    server_name localhost;

    # File upload size limit
    client_max_body_size 1000M;

    root /var/www/html/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass dixlase.test:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    location /vite {
        resolver 127.0.0.11 valid=30s;
        set $vite_upstream https://vite:5173;
        proxy_pass $vite_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Skip SSL verification (development only)
        proxy_ssl_verify off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.ht {
        deny all;
    }
}
