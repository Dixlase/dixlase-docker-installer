# HTTP-only configuration (default).
#
# Browsers block self-signed-cert pages on first access, so this mode
# serves plain HTTP on port 80 with no redirect to HTTPS, letting the
# install wizard render immediately. Set HTTPS=true in .env (and
# re-run ./setup.sh) to switch to nginx.https.conf for local TLS.
server {
    listen 80;
    server_name localhost;

    # File upload size limit
    client_max_body_size 1000M;

    root /var/www/html/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Nothing under the public storage symlink is ever meant to execute.
    # Uploads land there, and a file whose name ends in .php would otherwise
    # be handed to php-fpm.
    location ~ ^/storage/.*\.(php|phar|phtml)$ {
        return 404;
    }

    # Dotfiles under public/ are configuration, not content (.htaccess ships
    # in the repo for Apache users). /.well-known stays reachable so an
    # operator can serve security.txt from it.
    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~ \.php$ {
        # Only pass requests that name a real file. Without this, a request
        # for /uploads/photo.jpg/x.php reaches php-fpm, which with PHP's
        # default cgi.fix_pathinfo walks back to photo.jpg and executes it.
        try_files $uri =404;
        # Resolve the app upstream per request (resolver + variable) so an
        # app-container restart with a new IP does not strand nginx on the
        # dead address and 502 until web restarts. Same pattern as /vite.
        resolver 127.0.0.11 valid=30s;
        set $dixlase_app dixlase.test:9000;
        include fastcgi_params;
        fastcgi_pass $dixlase_app;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        # Core updates can exceed nginx's default 60s; allow PHP's 300s.
        fastcgi_read_timeout 300s;
    }

    location /vite {
        resolver 127.0.0.11 valid=30s;
        set $vite_upstream https://vite:5173;
        proxy_pass $vite_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Skip SSL verification (development only)
        proxy_ssl_verify off;
    }

    # Long-lived cache for built assets under /assets/.
    # Vite emits content-hashed filenames (`<name>-<hash>.<ext>`) whose
    # bytes never change for a given URL: a new URL is minted for every
    # content change. `immutable` tells the browser it never has to
    # revalidate, and `^~` beats the regex block below so this wins
    # for asset requests specifically.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri /index.php?$query_string;
    }
}
