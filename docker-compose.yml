# Dixlase Docker Environment
#
# Use standard ports (HTTP 80 / HTTPS 443 / MySQL 3306).
# Override APP_PORT / FORWARD_DB_PORT etc. in .env if other services conflict.
#
# Development mode (Vite hot-reload):
#   docker compose --profile dev up -d
# Production mode (pre-built assets):
#   docker compose up -d

services:
  dixlase.test:
    container_name: ${CONTAINER_PREFIX:-dixlase}-app
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - composer_auth
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
      # Mount host SSH keys read-only so the DixlaseDeploy plugin's CLI
      # (php artisan deploy:push/pull) can authenticate to remote hosts.
      # The plugin keeps its own UserKnownHostsFile, so :ro is fine.
      - ${HOME}/.ssh:/root/.ssh:ro
    environment:
      - PHP_FPM_LISTEN_MODE=666
    depends_on:
      - mysql
    networks:
      - dixlase
    restart: always

  web:
    container_name: ${CONTAINER_PREFIX:-dixlase}-web
    image: nginx:alpine
    restart: always
    volumes:
      - ./html:/var/www/html
      # NGINX_VARIANT is exported by setup.sh based on the HTTPS flag in .env.
      - ./nginx/nginx.${NGINX_VARIANT:-http}.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/ssl/private
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    depends_on:
      - dixlase.test
    networks:
      - dixlase

  mysql:
    container_name: ${CONTAINER_PREFIX:-dixlase}-mysql
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-dixlase}"
      MYSQL_USER: "${DB_USERNAME:-dixlase}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
    ports:
      # Bind to 127.0.0.1 by default so the DB is reachable only from this
      # host (TablePlus / Sequel Ace on the host machine still work). Override
      # DB_BIND_ADDRESS to 0.0.0.0 only if you intentionally need LAN-wide
      # access — that is what akiramysql-style bots scan for. See SECURITY.md.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - dixlase

  adminer:
    container_name: ${CONTAINER_PREFIX:-dixlase}-adminer
    image: adminer:latest
    restart: always
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${FORWARD_ADMINER_PORT:-8081}:8080"
    networks:
      - dixlase

  mailpit:
    container_name: ${CONTAINER_PREFIX:-dixlase}-mail
    image: axllent/mailpit
    restart: always
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    networks:
      - dixlase

  redis:
    container_name: ${CONTAINER_PREFIX:-dixlase}-redis
    image: redis:latest
    restart: always
    # Activated by the "redis" profile (COMPOSE_PROFILES exported by setup.sh).
    profiles: ["redis"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - dixlase
    volumes:
      - redis:/data

  cron:
    container_name: ${CONTAINER_PREFIX:-dixlase}-cron
    # Activated by the "cron" profile (COMPOSE_PROFILES exported by
    # setup.sh from the CRON flag in .env). Default is on so Laravel's
    # scheduler — and therefore the `extension_update_check_interval`
    # security setting — actually fires. Operators who run
    # `php artisan schedule:run` from a host cron can set CRON=false to
    # opt out of the container.
    profiles: ["cron"]
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - composer_auth
    restart: always
    volumes:
      - ./html:/var/www/html
    depends_on:
      - mysql
    networks:
      - dixlase
    # Laravel's scheduler is designed to be invoked every minute; the
    # actual cadence of individual jobs (dls:source:check, integrity
    # scan, etc.) is decided inside routes/console.php on each tick. We
    # use a sleep loop instead of a real cron daemon because the only
    # job here is `schedule:run` itself — installing cron / supervisor
    # just to invoke one command every minute is more moving parts than
    # the benefit. `set -e` is intentionally omitted: scheduled job
    # failures should not tear the loop down, since schedule:run
    # already catches per-job exceptions internally.
    command:
      - sh
      - -c
      - |
        while :; do
          php /var/www/html/artisan schedule:run --no-interaction >> /var/www/html/storage/logs/cron.log 2>&1 || true
          sleep 60
        done

  vite:
    container_name: ${CONTAINER_PREFIX:-dixlase}-vite
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.vite
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
    ports:
      - "${FORWARD_VITE_PORT:-5173}:5173"
    environment:
      # Tell vite.config.js which host-side port the browser will connect
      # to for HMR. The container still binds 5173 internally; this is just
      # the URL announced to the client.
      VITE_HMR_CLIENT_PORT: "${FORWARD_VITE_PORT:-5173}"
    networks:
      - dixlase

networks:
  dixlase:
    driver: bridge

# Build-time secrets. The composer_auth file is mounted only during
# `docker compose build` (never into running containers and never into
# the final image). It carries the GitHub OAuth token used by composer
# to clone the private `dixlase/dixlase-onepage` theme. Operators must
# create ~/.composer/auth.json on the host with the standard
# composer auth JSON: {"github-oauth":{"github.com":"<PAT>"}}.
secrets:
  composer_auth:
    file: ${HOME}/.composer/auth.json

volumes:
  redis:
