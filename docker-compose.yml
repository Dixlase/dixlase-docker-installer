# Dixlase Docker Environment
#
# Use standard ports (HTTP 80 / HTTPS 443 / MySQL 3306).
# Override APP_PORT / FORWARD_DB_PORT etc. in .env if other services conflict.
#
# Development mode (Vite hot-reload):
#   docker compose --profile dev up -d
# Built-assets mode (no Vite dev server):
#   docker compose up -d
#
# Everything except the site itself (APP_PORT / APP_SSL_PORT) is published on
# 127.0.0.1 only, so running ./setup.sh on a VPS or a shared network does not
# hand the database, Adminer or the mail catcher to whoever can reach the
# host. Read SECURITY.md before changing any *_BIND_ADDRESS.

services:
  dixlase.test:
    container_name: ${CONTAINER_PREFIX:-dixlase}-app
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - composer_auth
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
      # The host's SSH keys are NOT mounted here. The DixlaseDeploy plugin's
      # CLI (php artisan deploy:push/pull) needs them, but so could anything
      # else that runs in this container — composer and npm install scripts
      # included — and setup.sh / update.sh run those as root. Deploy users
      # opt in with docker-compose.deploy.yml (see that file and SECURITY.md).
    environment:
      - PHP_FPM_LISTEN_MODE=666
      # After a web-triggered core update the app refreshes php-fpm's
      # opcache by POSTing to /system/fpm-cache-reset on the web service,
      # authenticated with a shared token, instead of signalling php-fpm
      # (which runs as PID 1 and cannot be signalled by the www-data
      # worker). The image ships clear_env=no, so these reach the fpm
      # workers; Laravel's immutable dotenv keeps them over any html/.env
      # value. The token is generated into the root .env by setup.sh.
      - CORE_FPM_RESET_URL=http://web/system/fpm-cache-reset
      - CORE_FPM_RESET_TOKEN=${CORE_FPM_RESET_TOKEN:-}
    depends_on:
      - mysql
    networks:
      - dixlase
    restart: always

  web:
    container_name: ${CONTAINER_PREFIX:-dixlase}-web
    image: nginx:alpine
    restart: always
    volumes:
      - ./html:/var/www/html
      # NGINX_VARIANT is exported by setup.sh based on the HTTPS flag in .env.
      # Mounted as a template, not straight into conf.d: the nginx image runs
      # envsubst over /etc/nginx/templates/*.template at start-up, which is how
      # the HTTP -> HTTPS redirect learns the published HTTPS port (a container
      # only ever sees its own 443). NGINX_ENVSUBST_FILTER keeps the
      # substitution to our own DIXLASE_ variables, so nginx's own $host,
      # $uri and friends pass through untouched.
      - ./nginx/nginx.${NGINX_VARIANT:-http}.conf:/etc/nginx/templates/default.conf.template
      - ./certs:/etc/ssl/private
    environment:
      - DIXLASE_HTTPS_PORT=${APP_SSL_PORT:-443}
      - NGINX_ENVSUBST_FILTER=DIXLASE_
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    depends_on:
      - dixlase.test
    networks:
      - dixlase

  mysql:
    container_name: ${CONTAINER_PREFIX:-dixlase}-mysql
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-dixlase}"
      MYSQL_USER: "${DB_USERNAME:-dixlase}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
      # Optional migrator user (opt-in DB privilege separation).
      # When both are set, mysql-initdb/01-permissions.sh fires on
      # first init: strips DDL from ${DB_USERNAME} and creates
      # ${DB_MIGRATE_USERNAME} with ALL PRIVILEGES. Migrations must
      # then run with `php artisan migrate --database=mysql_migrate`.
      # See docs/operations/db-privilege-separation.md in the Core
      # repo for the rationale and the operator procedure.
      DB_MIGRATE_USERNAME: "${DB_MIGRATE_USERNAME:-}"
      DB_MIGRATE_PASSWORD: "${DB_MIGRATE_PASSWORD:-}"
    ports:
      # Bind to 127.0.0.1 by default so the DB is reachable only from this
      # host (TablePlus / Sequel Ace on the host machine still work). Override
      # DB_BIND_ADDRESS to 0.0.0.0 only if you intentionally need LAN-wide
      # access — that is what akiramysql-style bots scan for. See SECURITY.md.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      # Init scripts only fire when the data dir is empty (first boot).
      # 01-permissions.sh applies the privilege split iff DB_MIGRATE_*
      # are set — otherwise it is a no-op.
      - ./mysql-initdb:/docker-entrypoint-initdb.d:ro
    networks:
      - dixlase

  adminer:
    container_name: ${CONTAINER_PREFIX:-dixlase}-adminer
    image: adminer:latest
    restart: always
    # Activated by the "tools" profile (TOOLS in .env, on by default).
    # Adminer signs in to MariaDB with the credentials from .env, so
    # publishing Adminer publishes the database: full read/write, which is
    # enough to create an administrator and upload a plugin (= PHP). Hence
    # both the loopback bind and the profile. Its server field also stays
    # editable, so it can reach anything else on the compose network.
    profiles: ["tools"]
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_BIND_ADDRESS:-127.0.0.1}:${FORWARD_ADMINER_PORT:-8081}:8080"
    networks:
      - dixlase

  mailpit:
    container_name: ${CONTAINER_PREFIX:-dixlase}-mail
    image: axllent/mailpit
    restart: always
    # Activated by the "tools" profile (TOOLS in .env, on by default).
    # Mailpit's web UI shows every captured mail with no authentication —
    # during a first install that includes the password-reset and two-factor
    # mails — so only the UI port is published, and only on the loopback
    # interface. The app reaches SMTP at mailpit:1025 over the compose
    # network, which is unaffected.
    profiles: ["tools"]
    ports:
      - "${MAILPIT_BIND_ADDRESS:-127.0.0.1}:${FORWARD_MAILPIT_PORT:-8025}:8025"
    networks:
      - dixlase

  redis:
    container_name: ${CONTAINER_PREFIX:-dixlase}-redis
    image: redis:latest
    restart: always
    # Activated by the "redis" profile (COMPOSE_PROFILES exported by setup.sh).
    profiles: ["redis"]
    # No published port. Laravel reaches Redis at redis:6379 over the compose
    # network, and Redis here runs without a password: on a reachable host a
    # published 6379 lets anyone read and forge sessions when SESSION_DRIVER
    # is redis. Add a mapping yourself if you need a host-side client, and
    # bind it to 127.0.0.1.
    networks:
      - dixlase
    volumes:
      - redis:/data

  cron:
    container_name: ${CONTAINER_PREFIX:-dixlase}-cron
    # Activated by the "cron" profile (COMPOSE_PROFILES exported by
    # setup.sh from the CRON flag in .env). Default is on so Laravel's
    # scheduler — and therefore the `extension_update_check_interval`
    # security setting — actually fires. Operators who run
    # `php artisan schedule:run` from a host cron can set CRON=false to
    # opt out of the container.
    profiles: ["cron"]
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - composer_auth
    restart: always
    volumes:
      - ./html:/var/www/html
    depends_on:
      - mysql
    networks:
      - dixlase
    # Laravel's scheduler is designed to be invoked every minute; the
    # actual cadence of individual jobs (dls:source:check, integrity
    # scan, etc.) is decided inside routes/console.php on each tick. We
    # use a sleep loop instead of a real cron daemon because the only
    # job here is `schedule:run` itself — installing cron / supervisor
    # just to invoke one command every minute is more moving parts than
    # the benefit. `set -e` is intentionally omitted: scheduled job
    # failures should not tear the loop down, since schedule:run
    # already catches per-job exceptions internally.
    #
    # Drop to www-data (the uid php-fpm workers run as) before invoking
    # the scheduler. The container starts as root so the ENTRYPOINT can
    # chown storage, but schedule:run must not run as root: Laravel would
    # otherwise create the shared daily log storage/logs/dixlase-<date>.log
    # root-owned, and a later web request (www-data) appending to that same
    # file fails with "Permission denied" — which can abort a web-triggered
    # core update. Redirect inside the su so cron.log is www-data-owned too.
    command:
      - sh
      - -c
      - |
        while :; do
          su www-data -s /bin/sh -c 'php /var/www/html/artisan schedule:run --no-interaction >> /var/www/html/storage/logs/cron.log 2>&1' || true
          sleep 60
        done

  vite:
    container_name: ${CONTAINER_PREFIX:-dixlase}-vite
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.vite
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
    # Loopback only: the dev server reads from the project root, so anyone
    # who can reach it can fetch files under html/ through Vite's /@fs/
    # paths (storage/logs, database/*.sqlite, config/*.php). --dev is for a
    # workstation, never for a reachable host.
    ports:
      - "${VITE_BIND_ADDRESS:-127.0.0.1}:${FORWARD_VITE_PORT:-5173}:5173"
    environment:
      # Tell vite.config.js which host-side port the browser will connect
      # to for HMR. The container still binds 5173 internally; this is just
      # the URL announced to the client.
      VITE_HMR_CLIENT_PORT: "${FORWARD_VITE_PORT:-5173}"
    networks:
      - dixlase

networks:
  dixlase:
    driver: bridge

# Build-time secrets. The composer_auth file is mounted only during
# `docker compose build` (never into running containers and never into
# the final image). It carries the GitHub OAuth token used by composer
# to clone the private `dixlase/dixlase-onepage` theme. Operators must
# create ~/.composer/auth.json on the host with the standard
# composer auth JSON: {"github-oauth":{"github.com":"<PAT>"}}.
secrets:
  composer_auth:
    file: ${HOME}/.composer/auth.json

volumes:
  redis:
