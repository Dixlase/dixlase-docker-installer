# Dixlase Docker Environment
#
# Use standard ports (HTTP 80 / HTTPS 443 / MySQL 3306).
# Override APP_PORT / FORWARD_DB_PORT etc. in .env if other services conflict.
#
# Development mode (Vite hot-reload):
#   docker compose --profile dev up -d
# Production mode (pre-built assets):
#   docker compose up -d

services:
  dixlase.test:
    container_name: ${CONTAINER_PREFIX:-dixlase}-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
    environment:
      - PHP_FPM_LISTEN_MODE=666
    depends_on:
      - mysql
    networks:
      - dixlase
    restart: always

  web:
    container_name: ${CONTAINER_PREFIX:-dixlase}-web
    image: nginx:alpine
    restart: always
    volumes:
      - ./html:/var/www/html
      # NGINX_VARIANT is exported by setup.sh based on the HTTPS flag in .env.
      - ./nginx/nginx.${NGINX_VARIANT:-http}.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/ssl/private
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    depends_on:
      - dixlase.test
    networks:
      - dixlase

  mysql:
    container_name: ${CONTAINER_PREFIX:-dixlase}-mysql
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-dixlase}"
      MYSQL_USER: "${DB_USERNAME:-dixlase}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-password}"
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - dixlase

  adminer:
    container_name: ${CONTAINER_PREFIX:-dixlase}-adminer
    image: adminer:latest
    restart: always
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${FORWARD_ADMINER_PORT:-8081}:8080"
    networks:
      - dixlase

  mailpit:
    container_name: ${CONTAINER_PREFIX:-dixlase}-mail
    image: axllent/mailpit
    restart: always
    ports:
      - "${FORWARD_MAILPIT_PORT:-8025}:8025"
    networks:
      - dixlase

  redis:
    container_name: ${CONTAINER_PREFIX:-dixlase}-redis
    image: redis:latest
    restart: always
    # Activated by the "redis" profile (COMPOSE_PROFILES exported by setup.sh).
    profiles: ["redis"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - dixlase
    volumes:
      - redis:/data

  vite:
    container_name: ${CONTAINER_PREFIX:-dixlase}-vite
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.vite
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
    ports:
      - "${FORWARD_VITE_PORT:-5173}:5173"
    environment:
      # Tell vite.config.js which host-side port the browser will connect
      # to for HMR. The container still binds 5173 internally; this is just
      # the URL announced to the client.
      VITE_HMR_CLIENT_PORT: "${FORWARD_VITE_PORT:-5173}"
    networks:
      - dixlase

networks:
  dixlase:
    driver: bridge

volumes:
  redis:
