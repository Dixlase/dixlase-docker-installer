# Dixlase CMS Sandbox Environment
# 開発環境とポートが競合しない独立構成
#
# 開発環境との差分:
#   HTTPS: 443 → 8443
#   HTTP:  8080 → 8180
#   MySQL: 3306 → 3307
#   phpMyAdmin: 8081 → 8182
#   Mailpit: 8025 → 8126
#   Redis: 6379 → 6380
#   Vite: 不要（ビルド済みアセットを使用）

services:
  laravel.test:
    container_name: dixlase-sandbox-app
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./html:/var/www/html
      - ./certs:/etc/ssl/private
    ports:
      - "9001:9000"
    environment:
      - PHP_FPM_LISTEN_MODE=666
    depends_on:
      - mysql
    networks:
      - sandbox
    restart: always

  web:
    container_name: dixlase-sandbox-web
    image: nginx:alpine
    restart: always
    volumes:
      - ./html:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/ssl/private
    ports:
      - "8180:80"
      - "8443:443"
    depends_on:
      - laravel.test
    networks:
      - sandbox

  mysql:
    container_name: dixlase-sandbox-mysql
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dixlase_sandbox
      MYSQL_USER: dixlase
      MYSQL_PASSWORD: dixlase
    ports:
      - "3307:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      - sandbox

  adminer:
    container_name: dixlase-sandbox-adminer
    image: adminer:latest
    restart: always
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8182:8080"
    networks:
      - sandbox

  mailpit:
    container_name: dixlase-sandbox-mail
    image: axllent/mailpit
    restart: always
    ports:
      - "8126:8025"
    networks:
      - sandbox

  redis:
    container_name: dixlase-sandbox-redis
    image: redis:latest
    restart: always
    ports:
      - "6380:6379"
    networks:
      - sandbox
    volumes:
      - redis:/data

networks:
  sandbox:
    driver: bridge

volumes:
  mysql:
  redis:
