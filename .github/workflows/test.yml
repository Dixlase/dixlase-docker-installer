name: Test

on:
  # next is where development lands and main is the latest release, so both
  # are worth a run: next on every merge, main when a release is pushed.
  push:
    branches:
      - main
      - next
  # Every pull request, not only the ones that target next: a PR stacked on
  # another PR's branch (base != next) otherwise reports no checks at all, and
  # a base change alone does not fire this workflow either, so the stack would
  # stay unverified until after it merged.
  pull_request:

jobs:
  lint-and-validate:
    name: Lint, validate, and verify translations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Shell syntax check (bash -n)
        run: |
          set -e
          for f in setup.sh reset.sh update.sh entrypoint.sh convert-comments.sh; do
            bash -n "$f"
            echo "OK: $f"
          done

      - name: ShellCheck
        run: |
          shellcheck setup.sh reset.sh update.sh entrypoint.sh convert-comments.sh

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: The database image is pinned, not floating
        run: |
          set -e
          # A floating tag here is what #78 fixed: MariaDB upgrades mysql/ in
          # place when it starts, and no older server opens that directory
          # afterwards, so a tag that crosses a line makes an ordinary pull a
          # one-way database upgrade.
          line=$(sed -n 's|^[[:space:]]*image: *[$]{DB_IMAGE:-\([^}]*\)}.*|\1|p' docker-compose.yml | head -1)
          case "$line" in
            mariadb:[0-9]*.[0-9]*)
              echo "OK: the database service defaults to $line."
              ;;
            *)
              echo "The database service must default to a pinned MariaDB line, not '${line:-nothing}'." >&2
              exit 1
              ;;
          esac

      - name: Verify dictionary keys exist verbatim in source
        run: |
          set -e
          fail=0
          for dict in $(find lang -name '*.tsv' -type f); do
            # lang/<locale>/<source-path>.tsv -> <source-path>
            rel="${dict#lang/*/}"
            source="${rel%.tsv}"
            if [ ! -f "$source" ]; then
              echo "MISS  source not found: $source (referenced by $dict)"
              fail=1
              continue
            fi
            while IFS=$'\t' read -r key _value; do
              [ -z "$key" ] && continue
              if ! grep -qF -- "$key" "$source"; then
                echo "MISS  key not in $source: '$key' (from $dict)"
                fail=1
              fi
            done < "$dict"
          done
          if [ "$fail" -ne 0 ]; then
            echo "Dictionary/source consistency check failed."
            exit 1
          fi
          echo "All dictionary keys exist in their source files."

      - name: Round-trip translation test (EN -> JA -> EN)
        run: |
          set -e
          mkdir /tmp/before
          cp setup.sh reset.sh update.sh \
             Dockerfile Dockerfile.vite docker-compose.yml \
             .env.example /tmp/before/
          cp -r nginx /tmp/before/
          ./convert-comments.sh ja
          ./convert-comments.sh ja --reverse
          for f in setup.sh reset.sh update.sh \
                   Dockerfile Dockerfile.vite docker-compose.yml \
                   nginx/nginx.http.conf nginx/nginx.https.conf \
                   .env.example; do
            diff -q "/tmp/before/$f" "$f"
          done
          echo "Round-trip preserved every file byte-for-byte."
