name: Smoke test (E2E)

on:
  workflow_dispatch:
  # Run daily as well. The push trigger only fires on installer changes, but
  # the test installs the current dixlase-core main, so a core change can
  # break new installs without this workflow ever running (on 2026-09-23 a
  # core PR removed patches/ and every new install failed for about 24 hours
  # before anyone noticed). 18:00 UTC = 03:00 JST.
  #
  # If this starts failing every day with an authentication error, check the
  # CORE_REPO_TOKEN secret first — an expired PAT fails the same way.
  schedule:
    - cron: '0 18 * * *'
  push:
    branches:
      - main
    paths:
      - 'setup.sh'
      - 'Dockerfile'
      - 'Dockerfile.vite'
      - 'docker-compose.yml'
      - 'nginx/**'
      - 'php/**'
      - '.env.example'
      - 'entrypoint.sh'
      - 'app-entrypoint.sh'
      - '.github/workflows/smoke.yml'

jobs:
  smoke:
    name: End-to-end setup with maintainer credentials
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout installer
        uses: actions/checkout@v5

      - name: Checkout dixlase-core into html/
        uses: actions/checkout@v5
        with:
          repository: Dixlase/dixlase-core
          ref: main
          token: ${{ secrets.CORE_REPO_TOKEN }}
          path: html

      # Dockerfile mounts ~/.composer/auth.json as a BuildKit secret so
      # composer can authenticate against the private theme-dixlase-onepage
      # VCS repo during `composer install`. Without this file the secret
      # mount resolves to nothing (required=false) and composer falls back
      # to anonymous access, which 401s on the private repo. Write it from
      # CORE_REPO_TOKEN — the same PAT the workflow already uses for git
      # clones. The runner is ephemeral so no extra teardown is needed.
      - name: Bootstrap composer auth for private theme dep
        env:
          CORE_REPO_TOKEN: ${{ secrets.CORE_REPO_TOKEN }}
        run: |
          set -e
          mkdir -p "$HOME/.composer"
          printf '{"github-oauth":{"github.com":"%s"}}\n' "$CORE_REPO_TOKEN" > "$HOME/.composer/auth.json"
          chmod 600 "$HOME/.composer/auth.json"

      - name: Run setup.sh (html/ pre-placed; answer "n" to skip re-clone prompt)
        run: |
          set -e
          echo "n" | ./setup.sh

      # CI-only: bootstrap html/.env from core's bundled .env.example so Laravel
      # can boot far enough for the install wizard's first screen to render.
      # In normal use the Dixlase install wizard handles this on first browser
      # visit; we shortcut that here so curl can probe the stack. Removed in
      # the teardown step — it never gets committed back to the installer.
      - name: Bootstrap html/.env for smoke test (temporary)
        run: |
          set -e
          # Written inside the app container, not from the runner:
          # app-entrypoint.sh chowns the html root to www-data on every
          # start (so the install wizard can create .env there), after
          # which the runner cannot create files in that directory on a
          # Linux host. Same reason setup.sh does its html/ mutations
          # before the containers start.
          #
          # Align Laravel DB credentials with the MariaDB container the
          # compose stack just bootstrapped (defaults from repo-root
          # .env.example). Without this Laravel boots with whatever
          # DB_PASSWORD core's .env.example ships with and every request
          # 500s on "Access denied for user 'dixlase'".
          # APP_DEBUG=true so a 500 response body carries the stack trace
          # we need to diagnose Laravel-side failures from CI logs.
          docker compose exec -T dixlase.test sh -c '
            set -e
            cp /var/www/html/.env.example /var/www/html/.env
            sed -i.bak \
              -e "s|^DB_HOST=.*|DB_HOST=mysql|" \
              -e "s|^DB_DATABASE=.*|DB_DATABASE=dixlase|" \
              -e "s|^DB_USERNAME=.*|DB_USERNAME=dixlase|" \
              -e "s|^DB_PASSWORD=.*|DB_PASSWORD=dixlase|" \
              -e "s|^APP_DEBUG=.*|APP_DEBUG=true|" \
              /var/www/html/.env
            rm -f /var/www/html/.env.bak
            chown www-data:www-data /var/www/html/.env
          '
          docker compose exec -T dixlase.test php artisan key:generate --force
          docker compose exec -T dixlase.test php artisan config:clear

      - name: Show running containers
        if: always()
        run: docker compose ps

      - name: Smoke check — curl http://localhost:40080/
        run: |
          set -e
          # Default install ships HTTPS=false (plain HTTP) and APP_PORT=40080
          # (Dixlase's 4xxxx namespace, picked to avoid host-port conflicts).
          # The HTTPS path is exercised manually by setting HTTPS=true in
          # .env and re-running setup.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:40080/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "OK: CMS responded with HTTP $code (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code (not ready), waiting..."
            sleep 4
          done
          echo "CMS did not respond with a non-5xx status within the time budget."
          exit 1

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail 200

      - name: Capture HTTP response body (on failure)
        if: failure()
        run: |
          # With APP_DEBUG=true, a 500 body carries the actual exception
          # and stack trace, which docker logs alone don't show.
          curl -sS -o /tmp/resp.html -w "HTTP %{http_code}\n" http://localhost:40080/ || true
          echo "--- response body (first 400 lines) ---"
          head -n 400 /tmp/resp.html || true

      - name: Laravel storage log (on failure)
        if: failure()
        run: |
          docker compose exec -T dixlase.test sh -c 'ls -la storage/logs 2>/dev/null && tail -n 400 storage/logs/laravel.log 2>/dev/null || echo "(no laravel.log)"' || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v 2>/dev/null || true
          # Remove the smoke-test-only .env so the installer ships clean.
          # It is www-data-owned inside a www-data-owned html root by now,
          # so the runner cannot unlink it — delete through a throwaway
          # root container, the same approach reset.sh and setup.sh use.
          docker run --rm -v "$PWD:/work" alpine rm -f /work/html/.env 2>/dev/null || true
          rm -f html/.env 2>/dev/null || true

  # A second pass with no credentials at all — this is what a new user gets.
  #
  # The job above cannot see that class of failure: it pre-places html/ with a
  # token and writes ~/.composer/auth.json, so every credential-shaped problem
  # is hidden from it. On 2026-10-01 that blind spot shipped a Day 0 blocker —
  # compose declares the composer_auth secret with a concrete file, refuses to
  # build when it is absent, and `./setup.sh` died at step [4/6] for anyone who
  # had never installed a private Composer package. CI was green throughout.
  # It is the second failure of this shape; the first was the patches/ COPY in
  # 2026-09-23, which broke every new install for about 24 hours.
  #
  # Two deliberate differences from the job above:
  #   - html/ is NOT pre-placed, so setup.sh clones dixlase-core itself. That
  #     exercises the anonymous clone of a public core, which the other job
  #     never touches.
  #   - no auth.json is written, and persist-credentials is off so the token
  #     actions/checkout would otherwise leave in .git/config cannot be picked
  #     up by the clones setup.sh performs.
  smoke-anonymous:
    name: End-to-end setup with no credentials (what a new user gets)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout installer (no persisted credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Assert the runner has no Composer or GitHub credentials
        run: |
          set -e
          if [ -f "$HOME/.composer/auth.json" ]; then
            echo "This job is only meaningful without an auth.json; found one." >&2
            exit 1
          fi
          if git config --get-regexp 'http\..*\.extraheader' >/dev/null 2>&1; then
            echo "A credential extraheader is configured; the clones would not be anonymous." >&2
            exit 1
          fi
          echo "OK: no auth.json, no credential extraheader."

      # No html/ and no token: setup.sh clones dixlase-core on its own, the way
      # the README tells a reader to. GITHUB_TOKEN is cleared so nothing in the
      # script can fall back to it.
      - name: Run setup.sh with no credentials
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          COMPOSER_AUTH: ''
        run: |
          set -o pipefail
          ./setup.sh 2>&1 | tee /tmp/setup-anon.log

      - name: Assert setup created the empty auth.json and said so
        run: |
          set -e
          grep -q 'Created an empty .*auth\.json' /tmp/setup-anon.log
          test -f "$HOME/.composer/auth.json"
          test "$(tr -d '[:space:]' < "$HOME/.composer/auth.json")" = '{}'
          echo "OK: setup.sh created {} and reported it."

      - name: Assert the bundled theme was installed anonymously
        run: |
          set -e
          grep -q 'dixlase/dixlase-onepage' /tmp/setup-anon.log
          test -f html/themes/DixlaseOnePage/theme.json
          echo "OK: the private-repo-era theme dependency resolved without a token."

      # Same shortcut as the job above: the install wizard normally writes
      # html/.env on the first browser visit, so CI bootstraps it to let curl
      # probe the stack. Removed in the teardown.
      - name: Bootstrap html/.env for smoke test (temporary)
        run: |
          set -e
          docker compose exec -T dixlase.test sh -c '
            set -e
            cp /var/www/html/.env.example /var/www/html/.env
            sed -i.bak \
              -e "s|^DB_HOST=.*|DB_HOST=mysql|" \
              -e "s|^DB_DATABASE=.*|DB_DATABASE=dixlase|" \
              -e "s|^DB_USERNAME=.*|DB_USERNAME=dixlase|" \
              -e "s|^DB_PASSWORD=.*|DB_PASSWORD=dixlase|" \
              -e "s|^APP_DEBUG=.*|APP_DEBUG=true|" \
              /var/www/html/.env
            rm -f /var/www/html/.env.bak
            chown www-data:www-data /var/www/html/.env
          '
          docker compose exec -T dixlase.test php artisan key:generate --force
          docker compose exec -T dixlase.test php artisan config:clear

      - name: Show running containers
        if: always()
        run: docker compose ps

      - name: Smoke check — curl http://localhost:40080/
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:40080/ || true)
            if [ -n "$code" ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "OK: CMS responded with HTTP $code (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: HTTP $code (not ready), waiting..."
            sleep 4
          done
          echo "CMS did not respond with a non-5xx status within the time budget."
          exit 1

      - name: setup.sh log (on failure)
        if: failure()
        run: tail -n 200 /tmp/setup-anon.log || true

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail 200

      - name: Laravel storage log (on failure)
        if: failure()
        run: |
          docker compose exec -T dixlase.test sh -c 'tail -n 200 storage/logs/laravel.log 2>/dev/null || echo "(no laravel.log)"' || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v 2>/dev/null || true
          docker run --rm -v "$PWD:/work" alpine rm -rf /work/html 2>/dev/null || true
          rm -rf html 2>/dev/null || true
