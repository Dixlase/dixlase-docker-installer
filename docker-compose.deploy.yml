# Dixlase Docker Environment — DixlaseDeploy override (opt-in)
#
# Mounts the host's SSH keys into the app container read-only, which the
# DixlaseDeploy plugin's CLI (php artisan deploy:push / deploy:pull) needs to
# authenticate to remote hosts. The plugin keeps its own UserKnownHostsFile,
# so :ro is enough for it.
#
# This is a separate file because the mount is not free: every process in the
# container can read those keys, including install scripts of any composer or
# npm dependency, and setup.sh / update.sh run those as root. Only turn it on
# if you actually deploy from this container.
#
# Enable it for every compose command by adding this line to .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.deploy.yml
# setup.sh, reset.sh and update.sh then pick it up with no extra flags.
# For a one-off command instead:
#   docker compose -f docker-compose.yml -f docker-compose.deploy.yml up -d
#
# Prefer a key dedicated to deployment over your everyday key.

services:
  dixlase.test:
    volumes:
      - ${HOME}/.ssh:/root/.ssh:ro
